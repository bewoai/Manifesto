<!DOCTYPE html>
<html class="dark" lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İrtifa — Uçuş Planlama Sistemi</title>
  <meta name="description" content="İrtifa balon uçuş planlama ve manifesto yönetim sistemi" />
  <link rel="icon" href="/favicon.ico" />
  <!-- Yazı tipleri ve ikon fontu yerel: frontend/public/fonts (@font-face style.css'te). Ağ gerekmez. -->
  <link rel="preload" href="/fonts/material-symbols-outlined-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container/30">
  <div class="flex h-screen overflow-hidden" id="app-root">
    <!-- Sidebar -->
    <aside class="hidden md:flex fixed left-0 top-0 h-full w-72 z-40 bg-surface-container-lowest/85 backdrop-blur-2xl border-r border-tertiary/[.08] flex-col py-8 gap-8" id="sidebar"></aside>

    <!-- Main Content -->
    <main class="flex-1 md:ml-72 overflow-y-auto custom-scrollbar relative">
      <!-- Top Bar -->
      <header class="fixed top-0 left-0 md:left-72 right-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-tertiary/10 overflow-hidden flex justify-between items-center px-gutter py-4" id="page-header"></header>

      <!-- Page Body -->
      <div class="pt-24 pb-12 px-gutter" id="page-body"></div>
    </main>
  </div>

  <!-- Toast Container -->
  <div class="fixed top-20 right-6 z-[300] flex flex-col gap-3 pointer-events-none" id="toast-container"></div>

  <!-- Modal Root -->
  <div id="modal-root"></div>

  <script type="module" src="/app.js?v=2"></script>
</body>
</html>
